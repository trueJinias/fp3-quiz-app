name: fp3_quiz_app
description: A quiz app for FP3 Grade qualification exam.
publish_to: 'none'
version: 1.0.5+62

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  json_annotation: ^4.8.1
  shared_preferences: ^2.2.2
  google_mobile_ads: ^5.0.0
  firebase_core: ^3.1.0
  firebase_analytics: ^11.0.1
  firebase_crashlytics: ^4.0.1
  firebase_performance: ^0.10.0
  firebase_remote_config: ^5.0.1
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  flutter_timezone: ^5.0.1
  introduction_screen: ^3.1.14
  in_app_purchase: ^3.1.13
  flutter_native_splash: ^2.3.10
  google_fonts: ^6.1.0
  webview_flutter: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  json_serializable: ^6.7.1
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon_new.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon_new.png"

flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/icon/app_icon_new.png"
  android_12:
    image: "assets/icon/app_icon_new.png"
    color: "#FFFFFF"

flutter:
  uses-material-design: true
  assets:
    - assets/questions.json
    - assets/icon/
    - assets/diagrams/
